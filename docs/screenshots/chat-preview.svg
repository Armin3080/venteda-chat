<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">VENTEDA CHAT interface design preview</title><desc id="desc">Illustrative dark glass messaging interface with navigation, conversation list, and chat workspace.</desc>
