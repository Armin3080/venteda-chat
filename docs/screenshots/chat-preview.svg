<rect x="548" y="190" width="440" height="74" rx="18" fill="#16334d" stroke="#9bc8e4" stroke-opacity=".15"/><text x="570" y="220" fill="#e5f2fc" font-family="Arial" font-size="14">Hey! I just finished the new concept.</text><text x="570" y="243" fill="#9bb4c9" font-family="Arial" font-size="12">The crystal layers feel much cleaner now.</text><text x="958" y="250" fill="#7795ad" font-family="Arial" font-size="10" text-anchor="end">10:43</text>
<rect x="852" y="290" width="500" height="92" rx="18" fill="url(#cyan)"/><text x="876" y="322" fill="#061a2d" font-family="Arial" font-size="14" font-weight="600">This is exactly the direction I wanted.</text><text x="876" y="346" fill="#08233b" font-family="Arial" font-size="13">I love the soft lighting and the depth. ✨</text><text x="1320" y="365" fill="#0a2b47" font-family="Arial" font-size="10" text-anchor="end">10:44 · ✓✓</text>
<rect x="548" y="410" width="400" height="74" rx="18" fill="#16334d" stroke="#9bc8e4" stroke-opacity=".15"/><text x="570" y="440" fill="#e5f2fc" font-family="Arial" font-size="14">I'll prepare the next build with the same system.</text><text x="570" y="463" fill="#9bb4c9" font-family="Arial" font-size="12">We can review the admin panel after that.</text>
<rect x="852" y="510" width="500" height="58" rx="18" fill="#16334d" stroke="#42d9ff" stroke-opacity=".2"/><text x="876" y="544" fill="#dff7ff" font-family="Arial" font-size="13">Perfect. Send me a preview when it's ready.</text><text x="1320" y="556" fill="#7795ad" font-family="Arial" font-size="10" text-anchor="end">10:46 · ✓✓</text>
