<rect x="174" y="116" width="298" height="42" rx="13" fill="#07182b" fill-opacity=".72" stroke="#a7dfff" stroke-opacity=".12"/><circle cx="194" cy="137" r="6" fill="none" stroke="#90abc2"/><path d="m199 142 5 5" stroke="#90abc2"/><text x="215" y="142" fill="#829db5" font-family="Arial" font-size="13">Search conversations</text>
